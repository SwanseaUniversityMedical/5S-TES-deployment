services:
  # grant the necessary permissions to RUSTFS volumes path
  rustfs_submission_perms:
    image: alpine
    user: root
    volumes:
      - rustfs_submission_data:/data/rustfs
    command: chown -R 10001:10001 /data/rustfs
    networks:
      - sub-net

  rustfs_submission:
    security_opt:
      - "no-new-privileges:true"
    image: rustfs/rustfs:1.0.0-beta.7
    container_name: rustfs_submission
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # Console port
    environment:
      - RUSTFS_VOLUMES=/data/rustfs
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      # SECURITY: these defaults are public and well-known.
      # Override via env vars before exposing the listener beyond localhost.
      - RUSTFS_ACCESS_KEY=${TreMinioAdminUser}
      - RUSTFS_SECRET_KEY=${TreMinioAdminPassword}
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_IDENTITY_OPENID_ENABLE=true
      - RUSTFS_IDENTITY_OPENID_CONFIG_URL=${SUBMISSION_KEYCLOAK_URL}/realms/Dare-Control
      - RUSTFS_IDENTITY_OPENID_CLIENT_ID=Dare-Control-Minio
      - RUSTFS_IDENTITY_OPENID_OTHER_AUDIENCES=Dare-Control-UI,Dare-Control-API
      - RUSTFS_IDENTITY_OPENID_CLIENT_SECRET=${MinioOpenidSecret}
      - RUSTFS_IDENTITY_OPENID_SCOPES=openid
      - RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC=off
      - RUSTFS_IDENTITY_OPENID_REDIRECT_URI=${submissionMinioAdminConsole}/rustfs/admin/v3/oidc/callback/default
      - RUSTFS_IDENTITY_OPENID_DISPLAY_NAME=Login with KeyCloak
      - RUSTFS_IDENTITY_OPENID_CLAIM_NAME=policy
      # - RUSTFS_TLS_PATH=/opt/tls
    volumes:
      - rustfs_submission_data:/data/rustfs
      # TLS configuration directory.
      # Place at least:
      # - /opt/tls/ca.crt
      # - /opt/tls/rustfs_cert.pem
      # - /opt/tls/rustfs_key.pem
      # - ./deploy/data/certs/:/opt/tls
      # Permission baseline:
      # - default RustFS runtime user is 10001:10001
      # - ensure host mounts are writable by that user, or run with host-matched user
    depends_on:
      rustfs_submission_perms:
        condition: service_completed_successfully
    networks:
      - sub-net
    restart: unless-stopped
    healthcheck:
      # Production strict TLS example (SAN/FQDN aligned, no `-k`):
      # curl -f --cacert /opt/tls/ca.crt --resolve rustfs-a.example.com:9000:127.0.0.1 https://rustfs-a.example.com:9000/health
      # curl -f --cacert /opt/tls/ca.crt --resolve rustfs-a.example.com:9001:127.0.0.1 https://rustfs-a.example.com:9001/rustfs/console/health
      test:
        [
          "CMD",
          "sh",
          "-c",
          "curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
